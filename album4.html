<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 Album — Adv Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="profile-nav">
    <div class="container">
      <ul>
        <li><a href="index.html" style="color: inherit; text-decoration: none;">Timeline</a></li>
        <li><a href="photos.html" style="color: inherit; text-decoration: none;">Photos</a></li>
      </ul>
    </div>
  </nav>

  <div class="photos-page">
    <div class="container">
      <div class="photos-header">
        <h1>Day 4 Album</h1>
      </div>

      <div class="photos-container">
        <div class="photo-card">
          <img src="images/day4/day4 (1).jpg" alt="Day4-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day4/day4 (2).jpg" alt="Day4-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day4/day4 (3).jpg" alt="Day4-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day4/day4 (4).jpg" alt="Day4-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day4/day4 (5).jpg" alt="Day4-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day4/day4 (6).jpg" alt="Day4-1" class="album-img">
        </div>
      </div>
    </div>
  </div>

  <footer class="container footer muted">© 2025 AdvPortfolio</footer>

  <!-- Image Modal -->
  <div id="imageModal" class="image-modal hidden">
    <button id="closeImage" class="close-btn">×</button>
    <img id="modalImage" src="" alt="Full size image">
  </div>

  <script>
    const imgs = document.querySelectorAll('.album-img');
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeImageBtn = document.getElementById('closeImage');

    imgs.forEach(img => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', function() {
        modalImage.src = this.src;
        imageModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
    });

    closeImageBtn.addEventListener('click', function() {
      imageModal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    });

    imageModal.addEventListener('click', function(e) {
      if (e.target === imageModal) {
        imageModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }
    });

    const params = new URLSearchParams(window.location.search);
    const imageParam = params.get('image');
    if (imageParam) {
      modalImage.src = decodeURIComponent(imageParam);
      imageModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
  </script>
</body>
</html>
