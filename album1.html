<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 1 Album — Adv Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="profile-nav">
    <div class="container">
      <ul>
        <li><a href="home.html" style="color: inherit; text-decoration: none;">Timeline</a></li>
        <li><a href="photos.html" style="color: inherit; text-decoration: none;">Photos</a></li>
      </ul>
    </div>
  </nav>

  <div class="photos-page">
    <div class="container">
      <div class="photos-header">
        <h1>Day 1 Album</h1>
      </div>

      <div class="photos-container">
        <div class="photo-card">
          <img src="images/day1/581810788_847862717584688_563601703899592950_n.jpg" alt="Day1-1" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day1/581813198_821237024209144_9136994076716231387_n.jpg" alt="Day1-2" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day1/581922261_784730991228898_8303013295915264142_n.jpg" alt="Day1-3" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day1/581970194_817625894390162_6820488444874424055_n.jpg" alt="Day1-4" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day1/582009107_4325847654407861_1029002019752977216_n.jpg" alt="Day1-5" class="album-img">
        </div>
        <div class="photo-card">
          <img src="images/day1/582662015_1358335852405853_1888152225408134872_n.jpg" alt="Day1-6" class="album-img">
        </div>
      </div>
    </div>
  </div>

  <footer class="container footer muted">© 2025 AdvPortfolio</footer>

  <!-- Image Modal -->
  <div id="imageModal" class="image-modal hidden">
    <button id="closeImage" class="close-btn">×</button>
    <img id="modalImage" src="" alt="Full size image">
  </div>

  <script>
    const imgs = document.querySelectorAll('.album-img');
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeImageBtn = document.getElementById('closeImage');

    imgs.forEach(img => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', function() {
        modalImage.src = this.src;
        imageModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
    });

    closeImageBtn.addEventListener('click', function() {
      imageModal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    });

    imageModal.addEventListener('click', function(e) {
      if (e.target === imageModal) {
        imageModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
      }
    });

    // support opening via query param
    const params = new URLSearchParams(window.location.search);
    const imageParam = params.get('image');
    if (imageParam) {
      modalImage.src = decodeURIComponent(imageParam);
      imageModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
  </script>
</body>
</html>
